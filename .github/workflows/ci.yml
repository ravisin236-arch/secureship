name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repo.
permissions:
  contents: read

jobs:
  api-tests:
    name: API (Java / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  worker-tests:
    name: Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  # Week 2: security gates (Semgrep SAST, Syft/Grype SBOM + SCA, Trivy, Checkov) are added here.
